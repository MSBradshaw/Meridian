[project]
name = "vi-assignment"
version = "0.1.0"
description = "Take-home assignment submission."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "xgboost==3.0.5",
]

[tool.uv]
# Notebook deps live in their own group; installed by default so `uv sync` keeps the EDA runnable.
default-groups = ["dev", "notebook"]

[dependency-groups]
dev = ["pytest>=8"]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "assignment"
